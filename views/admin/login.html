<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{PAGE_TITLE}}</title>
  <link rel="stylesheet" href="/static/css/admin.css">
  {{{EXTRA_HEAD_HTML}}}
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <main id="main" class="admin-login-page">
    <section class="admin-login-card" aria-labelledby="login-title">
      <p class="admin-login-card__eyebrow">Control Plane</p>
      <h1 id="login-title" class="admin-login-card__title">Admin sign in</h1>
      <p class="admin-login-card__subtitle">Authenticate with the local admin_users table.</p>

      {{#if ERROR_MESSAGE}}
      <div class="admin-login-error" role="alert">
        {{ERROR_MESSAGE}}
      </div>
      {{/if}}

      <form method="post" action="{{LOGIN_PATH}}" class="admin-login-form">
        <label>
          <span>Username</span>
          <input type="text" name="username" autocomplete="username" required placeholder="admin">
        </label>
        <label>
          <span>Password</span>
          <input type="password" name="password" autocomplete="current-password" required placeholder="••••••••">
        </label>
        <button type="submit" class="admin-login-form__submit">Sign in</button>
      </form>
    </section>
  </main>
</body>
</html>

# /etc/nginx/sites-available/blotter-host.conf
#
# Wildcard vhost for blotter.host and every *.blotter.host child.
# Proxies everything to the Node app on 127.0.0.1:3000.
#
# Cert path: Let's Encrypt SAN cert for the apex and registered concrete
# subdomains. A true wildcard cert still requires DNS-01 validation.

# --- HTTP -> HTTPS redirect -----------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name blotter.host *.blotter.host;

    # ACME http-01 challenges (Certbot --webroot mode) land here.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS wildcard -------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blotter.host *.blotter.host;

    ssl_certificate     /etc/letsencrypt/live/blotter.host/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blotter.host/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers (kept conservative so tenant apps can override per-route)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/blotter-host.access.log;
    error_log  /var/log/nginx/blotter-host.error.log warn;

    # Sane upload ceiling
    client_max_body_size 25m;

    # --- Proxy to Node ---------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Critical: preserve the original host so the app can branch on it.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # If you front this with a CDN later, change to $http_x_forwarded_proto.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffering off keeps streaming/long-poll responsive
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
